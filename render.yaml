services:
  - type: web
    name: agentis-sales-agent
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_PROVIDER
        value: openrouter
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GROQ_MODEL
        value: groq/openai/gpt-oss-120b
      - key: OPENROUTER_MODEL
        value: openrouter/deepseek/deepseek-v4-flash-0731
      - key: CORS_ORIGINS
        value: https://agentis-new.vercel.app,http://localhost:5173
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
