services:
  - type: web
    name: agentis-sales-agent
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_PROVIDER
        value: groq
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GROQ_MODEL
        value: groq/llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: '["http://localhost:5173"]'
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
